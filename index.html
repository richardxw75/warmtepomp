<style>
  :root {
    --bg: #10141D; --card: #1E2536; --ink: #F1F5F9; --muted: #94A3B8;
    --line: #2D3750; --soft: #2A3350; --accent: #3DD5D3; --accent-ink: #10141D;
    --ok: #3DD5D3; --err: #FF8A8A; --warn: #F5C451; --warn-bg: #3A2F10;
    color-scheme: dark;
  }
  html { background: var(--bg); }
  body { padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 400;
    color: var(--ink); min-height: 100vh;
    background:
      radial-gradient(900px 520px at 0% -5%, #1c2247 0%, rgba(28,34,71,0) 62%),
      radial-gradient(700px 400px at 100% 0%, rgba(61,213,211,.07) 0%, rgba(61,213,211,0) 60%),
      var(--bg);
    background-attachment: fixed;
  }

  /* Merk */
  .brand { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .9rem 1rem; margin-bottom: 1.4rem; }
  .brand-id { display: flex; align-items: center; gap: .85rem; min-width: 0; }
  .brand-logo { height: 3.1rem; width: auto; flex: none; }
  .wordmark { font-weight: 700; font-size: 1.55rem; line-height: 1; letter-spacing: .015em; text-transform: uppercase; color: var(--ink); }
  .wordmark .t { color: var(--accent); }
  .tagline { font-weight: 300; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: .4rem; }
  .auth { display: flex; align-items: center; gap: .6rem; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.15rem 1.15rem 1.3rem; box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.18); }
  .card h2 { display: flex; align-items: center; gap: .6rem; font-size: 1.05rem; font-weight: 400; margin-bottom: 1rem; }
  .ico { width: 1.6rem; height: 1.6rem; flex: none; color: var(--accent); }
  .ico svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .lbl { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; font-size: .875rem; font-weight: 600; margin-bottom: .4rem; }
  .lbl .sub { color: var(--muted); font-weight: 300; font-size: .8rem; }
  .inp {
    width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: .6rem .8rem; font: inherit; font-size: 1rem; min-height: 2.85rem;
  }
  .inp::placeholder { color: #64748B; }
  .inp:focus-visible, .btn:focus-visible, .scale-track button:focus-visible, .chip:focus-visible, .rowbtn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .inp:focus { border-color: var(--accent); }
  .inp[readonly] { color: var(--muted); }
  textarea.inp { min-height: 5.5rem; resize: vertical; }
  .unit { position: relative; }
  .unit .inp { padding-right: 4.6rem; }
  .unit span { position: absolute; right: .85rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .8rem; font-weight: 300; pointer-events: none; }

  .scale-track { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .scale-track button {
    height: 2.75rem; border-radius: 8px; background: var(--bg); color: var(--muted);
    border: 1px solid var(--line); font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
  }
  .scale-track button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .badge { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); min-width: 1.5rem; text-align: right; }

  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: .3rem .95rem; font: inherit; font-size: .85rem; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .btn { border: 0; border-radius: 14px; padding: .8rem 1.3rem; font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; background: var(--accent); color: var(--accent-ink); min-height: 3rem; }
  .btn:hover:not(:disabled) { filter: brightness(1.07); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--accent); filter: none; }

  .savebar { position: sticky; bottom: 0; z-index: 20; background: rgba(16,20,29,.88); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom, 0px)); }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); flex: none; }
  .st-loading .dot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .st-success .dot { background: var(--ok); }
  .st-error .dot { background: var(--err); }
  .st-error #statusText { color: var(--err); }
  .st-success #statusText { color: var(--ok); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .st-loading .dot { animation: none; } }

  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: .8rem 1rem; font-size: .9rem; }
  .note { color: var(--muted); font-size: .85rem; font-weight: 300; }

<script>
(() => {
  document.title = CONFIG.title;
  { // woordmerk: eerste woord in accentkleur, rest in wit
    const [first, ...rest] = CONFIG.title.split(" ");
    const wm = document.getElementById("title");
    wm.replaceChildren(Object.assign(document.createElement("span"), { className: "t", textContent: first }), document.createTextNode(rest.length ? " " + rest.join(" ") : ""));
  }

  /* ---------------- Helpers ---------------- */
  const $ = (s) => document.querySelector(s);
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) { if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
    return el;
  }
  const pad = (n) => String(n).padStart(2, "0");
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const dagNaam = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("nl-NL", { weekday: "long" }).toLowerCase();
  const colLetter = (n) => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const fmt = (v) => (typeof v === "number" ? String(Math.round(v * 100) / 100) : String(v ?? ""));

  function normDate(v) {
    if (typeof v === "number" && v > 20000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    if (typeof v !== "string") return null;
    const s = v.trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return null;
  }

  function setStatus(kind, text) {
    $("#statusWrap").className = `flex items-center gap-2 min-w-0 text-sm st-${kind}`;
    $("#statusText").textContent = text;
  }

  /* ---------------- Staat ---------------- */
  const state = {
    cols: [], ncols: 0, dateIdx: -1, dagIdx: -1, entries: [], lastRow: 0, headerRow: 1, title: "", dagShort: false,
    dateAsText: false, dateStyle: null, loaded: false, prefilled: false, sig: "",
  };
  const ctl = {};   // kolomindex -> { el, get, set, badge? }
  let SHEET = CONFIG.sheetName.trim();

  /* ---------------- Iconen (minimalistisch, lijnstijl) ---------------- */
  const ICONS = {
    calendar: '<path d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M4 10h16M8 3v4M16 3v4"/>',
    moon: '<path d="M10 5.2A7.5 7.5 0 1 0 19.4 15 6.6 6.6 0 0 1 10 5.2z"/><path d="M14 3h3.5L14 7h3.5M18.6 9h2.6l-2.6 3h2.6"/>',
    pulse: '<path d="M2 12h4l2-6 4 12 3-9 2 3h5"/>',
    heart: '<path d="M12 20.5S3 15 3 8.9A4.7 4.7 0 0 1 12 6.7a4.7 4.7 0 0 1 9 2.2C21 15 12 20.5 12 20.5z"/><path d="M6.5 12.2h3l1.4-2.4 2 4.8 1.4-2.4h3.2"/>',
    chart: '<path d="M5 20v-5M10 20v-8M15 20v-6M20 20v-9"/><path d="M4 9.5l5-4 4 3 7-5.5M16 3h4v4"/>',
    pen: '<path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><path d="M14 7l3 3"/>',
    bolt: '<path d="M13 2L5 13.5h6L10 22l8-11.5h-6L13 2z"/>',
    thermo: '<path d="M10 14.6V5a2 2 0 1 1 4 0v9.6a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',
    sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/>',
    euro: '<path d="M17.5 7.5a6 6 0 1 0 0 9"/><path d="M5 10.5h9M5 13.5h9"/>',
  };
  const ICON_FOR = [[/^dag$/i, "calendar"], [/slaap/i, "moon"], [/body|stress|temperatuur/i, null], [/leefstijl/i, "heart"], [/opmerk/i, "pen"], [/laatste/i, "chart"]];
  function icon(name) {
    const s = document.createElement("span");
    s.className = "ico"; s.setAttribute("aria-hidden", "true");
    s.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name] || ICONS.pulse}</svg>`;
    return s;
  }

  /* ---------------- Formulierbesturing ---------------- */
  function numControl(c) {
    const inp = h("input", { class: "inp", type: "number", inputmode: "decimal", step: "any", placeholder: c.last != null ? `vorige: ${fmt(c.last)}` : "" });
    return {
      el: c.unit ? h("div", { class: "unit" }, inp, h("span", {}, c.unit)) : inp,
      get: () => (inp.value === "" ? "" : Number(inp.value)),
      set: (v) => { const n = Number(String(v ?? "").replace(",", ".")); inp.value = v === "" || v == null || isNaN(n) ? "" : String(n); },
    };
  }

  function scaleControl(min, max) {
    let val = "";
    const btns = [];
    const track = h("div", { class: "scale-track", role: "group", style: `grid-template-columns: repeat(${max - min + 1}, 1fr)` });
    const badge = h("span", { class: "badge" }, "–");
    for (let n = min; n <= max; n++) {
      const b = h("button", { type: "button", "aria-label": `Waarde ${n}`, "aria-pressed": "false", onclick: () => setNum(val === n ? "" : n) }, String(n));
      btns.push(b); track.append(b);
    }
    function setNum(v) {
      const n = Number(v);
      val = v === "" || v == null || !Number.isInteger(n) || n < min || n > max ? "" : n;
      btns.forEach((b, i) => {
        b.classList.toggle("on", val !== "" && min + i <= val);
        b.setAttribute("aria-pressed", String(val === min + i));
      });
      badge.textContent = val === "" ? "–" : String(val);
    }
    setNum("");
    return { el: track, get: () => val, set: setNum, badge };
  }

  function yesnoControl(c) {
    const listId = `dl-${c.idx}`;
    const inp = h("input", { class: "inp", type: "text", list: listId, autocomplete: "off" });
    const dl = h("datalist", { id: listId }, h("option", { value: "ja" }), h("option", { value: "nee" }));
    const chips = h("div", { class: "flex gap-2 mt-2" },
      h("button", { type: "button", class: "chip", onclick: () => (inp.value = "ja") }, "Ja"),
      h("button", { type: "button", class: "chip", onclick: () => (inp.value = "nee") }, "Nee"),
      h("button", { type: "button", class: "chip", onclick: () => (inp.value = "") }, "Leegmaken"));
    return { el: h("div", {}, inp, dl, chips), get: () => inp.value.trim(), set: (v) => (inp.value = v == null ? "" : String(v)) };
  }

  function textControl(c, area) {
    const inp = area ? h("textarea", { class: "inp" }) : h("input", { class: "inp", type: "text", autocomplete: "off", placeholder: c.last != null && !area ? `vorige: ${fmt(c.last)}` : "" });
    return { el: inp, get: () => inp.value.trim(), set: (v) => (inp.value = v == null ? "" : String(v)) };
  }

  /* ---------------- Kolommen afleiden uit de kopregel ---------------- */
  const NUM_RE = /kwh|\bkw\b|\bwh\b|temp|°|graad|stand|aantal|uren|uur\b|\bcop\b|m3|m³|liter|€|euro|prijs|kosten|verbruik|opbrengst|stroom|\bgas\b|energie|vermogen|minuten|%|dagen|tarief|opwek|levering|teruglever/i;
  const AREA_RE = /opmerk|notitie|toelicht|omschrijv|commentaar|memo/i;

  function inferColumns(headers, groups, rows, formulaRows) {
    const ncols = headers.length;
    const samplesOf = (j) => rows.slice(-40).map((r) => r[j]).filter((v) => v !== undefined && v !== "");

    let dateIdx = -1;
    if (CONFIG.dateColumn) dateIdx = headers.findIndex((x) => x.trim().toLowerCase() === CONFIG.dateColumn.trim().toLowerCase());
    if (dateIdx < 0) dateIdx = headers.findIndex((x) => /datum|date/i.test(x));
    if (dateIdx < 0) { const s = samplesOf(0); if (s.length && s.every((v) => normDate(v))) dateIdx = 0; }
    const dagIdx = headers.findIndex((x, j) => j !== dateIdx && !groups[j] && /^dag$/i.test(x.trim()));

    const cols = [];
    for (let j = 0; j < ncols; j++) {
      const header = headers[j].trim();
      const c = { idx: j, header, group: groups[j] || "", label: header, unit: "", kind: "text", editable: true, last: null, chips: [] };
      if (!header) { c.editable = false; c.kind = "skip"; cols.push(c); continue; }
      const m = header.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
      let paren = null;
      if (m && m[1]) { c.label = m[1]; paren = m[2].trim(); }
      const samples = samplesOf(j);
      c.last = samples.length ? samples[samples.length - 1] : null;
      const isFormula = formulaRows.slice(-5).some((r) => typeof r[j] === "string" && r[j].startsWith("="));
      const unitDefault = (CONFIG.unitByGroup || {})[c.group] ?? "";

      if (j === dateIdx) c.kind = "date";
      else if (j === dagIdx) c.kind = "dag";
      else if (isFormula) { c.kind = "formula"; c.editable = false; }
      else {
        const range = paren && paren.match(/^(\d+)\s*[-–]\s*(\d+)$/);
        if (range && Number(range[2]) - Number(range[1]) >= 1 && Number(range[2]) - Number(range[1]) <= 11) {
          c.kind = "scale"; c.min = Number(range[1]); c.max = Number(range[2]);
        } else {
          c.unit = paren && !range ? paren : unitDefault;
          const nums = samples.filter((v) => typeof v === "number");
          const strs = samples.filter((v) => typeof v === "string");
          if (samples.length && nums.length === samples.length) c.kind = "num";
          else if (nums.length && strs.length) { c.kind = "textnum"; c.chips = [...new Set(strs.map((s) => s.trim()))].slice(0, 3); }
          else if (samples.length && samples.every((v) => /^(ja|nee|yes|no)$/i.test(String(v).trim()))) c.kind = "yesno";
          else if (samples.length) c.kind = AREA_RE.test(header) ? "area" : "text";
          else c.kind = AREA_RE.test(header) ? "area" : NUM_RE.test(`${c.group} ${header}`) ? "num" : "text";
          if (c.kind !== "num" && c.kind !== "textnum") c.unit = "";
        }
      }
      cols.push(c);
    }
    return { cols, dateIdx, dagIdx };
  }

  function textnumControl(c) {
    const inp = h("input", { class: "inp", type: "text", autocomplete: "off", inputmode: "decimal", placeholder: c.last != null ? `vorige: ${fmt(c.last)}` : "" });
    const chips = h("div", { class: "flex gap-2 mt-2 flex-wrap" },
      c.chips.map((t) => h("button", { type: "button", class: "chip", onclick: () => (inp.value = t) }, t)),
      h("button", { type: "button", class: "chip", onclick: () => (inp.value = "") }, "Leegmaken"));
    return {
      el: h("div", {}, c.unit ? h("div", { class: "unit" }, inp, h("span", {}, c.unit)) : inp, chips),
      get: () => { const t = inp.value.trim(); return /^-?\d+([.,]\d+)?$/.test(t) ? Number(t.replace(",", ".")) : t; },
      set: (v) => (inp.value = v == null ? "" : String(v)),
    };
  }

  /* ---------------- Formulier opbouwen ---------------- */
  const dataCols = () => state.cols.filter((c) => c.editable && c.kind !== "date" && c.kind !== "dag");
  const DAG_KORT = ["zo", "ma", "di", "wo", "do", "vr", "za"];
  const dagLabel = (iso) => (state.dagShort ? DAG_KORT[new Date(iso + "T12:00:00").getDay()] : dagNaam(iso));

  const groupIcon = (k) => (/kosten/i.test(k) ? "euro" : /verbruik/i.test(k) ? "bolt" : /temperatuur/i.test(k) ? "thermo" : /instelling/i.test(k) ? "sliders" : "pulse");
  function buildForm() {
    const root = $("#form");
    root.replaceChildren();
    for (const k of Object.keys(ctl)) delete ctl[k];

    const mk = (c) => {
      if (c.kind === "date") { const inp = h("input", { class: "inp", type: "date", required: true, onchange: () => onDateChange(true) }); return { el: inp, get: () => inp.value, set: (v) => (inp.value = v ?? "") }; }
      if (c.kind === "dag") { const inp = h("input", { class: "inp", type: "text", readonly: true }); return { el: inp, get: () => inp.value, set: (v) => (inp.value = v ?? "") }; }
      if (c.kind === "num") return numControl(c);
      if (c.kind === "textnum") return textnumControl(c);
      if (c.kind === "scale") return scaleControl(c.min, c.max);
      if (c.kind === "yesno") return yesnoControl(c);
      return textControl(c, c.kind === "area");
    };
    const field = (c) => {
      const x = mk(c); ctl[c.idx] = x;
      const sub = c.kind === "scale" ? `${c.min}–${c.max}` : "";
      const right = x.badge ? x.badge : sub ? h("span", { class: "sub" }, sub) : null;
      const wide = c.kind === "scale" || c.kind === "area";
      return h("div", { class: wide ? "sm:col-span-2" : "" }, h("div", { class: "lbl" }, h("label", {}, c.label), right), x.el);
    };

    if (state.dateIdx >= 0) {
      const grid = h("div", { class: "grid gap-4 sm:grid-cols-2" }, field(state.cols[state.dateIdx]));
      if (state.dagIdx >= 0) grid.append(field(state.cols[state.dagIdx]));
      grid.append(h("p", { id: "dateHint", class: "note sm:col-span-2" }));
      root.append(h("section", { class: "card" }, h("h2", {}, icon("calendar"), "Dag"), grid));
    }
    const groups = [];
    for (const c of dataCols()) {
      const key = c.group || "Meting";
      let g = groups.find((x) => x.key === key);
      if (!g) groups.push((g = { key, cols: [] }));
      g.cols.push(c);
    }
    for (const g of groups) {
      root.append(h("section", { class: "card" }, h("h2", {}, icon(groupIcon(g.key)), g.key), h("div", { class: "grid gap-4 sm:grid-cols-2" }, g.cols.map(field))));
    }
    const formulas = state.cols.filter((c) => c.kind === "formula");
    if (formulas.length) root.append(h("p", { class: "note px-1" }, `Berekende kolommen worden niet overschreven: ${formulas.map((c) => c.header).join(", ")}.`));
    if (state.dateIdx >= 0) ctl[state.dateIdx].set(todayISO());
    state.prefilled = false;
  }

  function collect() {
    const out = Array(state.ncols).fill("");
    for (const c of state.cols) if (c.editable) out[c.idx] = ctl[c.idx].get();
    if (state.dateIdx >= 0) {
      if (!out[state.dateIdx]) { setStatus("error", "Vul een datum in."); return null; }
      if (state.dagIdx >= 0) out[state.dagIdx] = dagLabel(out[state.dateIdx]);
    }
    if (dataCols().every((c) => out[c.idx] === "")) { setStatus("error", "Vul minstens één waarde in."); return null; }
    return out;
  }

  /* ---------------- Authenticatie (Google Identity Services) ---------------- */
  const SHEET_ID = (CONFIG.spreadsheet.match(/\/d\/([\w-]+)/) || [null, CONFIG.spreadsheet.trim()])[1];
  const GID = (CONFIG.spreadsheet.match(/[#&?]gid=(\d+)/) || [])[1];
  let tokenClient = null, accessToken = null, tokenExpiry = 0, signedIn = false, pending = null;

  function waitForGoogle(ms = 8000) {
    return new Promise((resolve, reject) => {
      const t0 = Date.now();
      (function poll() {
        if (window.google?.accounts?.oauth2) return resolve();
        if (Date.now() - t0 > ms) return reject(new Error("Het Google-inlogscript kon niet worden geladen (internetverbinding of adblocker?)."));
        setTimeout(poll, 100);
      })();
    });
  }
  function requestToken() {
    return new Promise((resolve, reject) => { pending = { resolve, reject }; tokenClient.requestAccessToken({ prompt: "" }); });
  }
  async function ensureToken() {
    if (accessToken && Date.now() < tokenExpiry) return accessToken;
    return requestToken();
  }

  async function initAuth() {
    if (CONFIG.clientId.startsWith("VUL-")) {
      $("#setupBanner").classList.remove("hidden");
      $("#loginBtn").disabled = true;
      setStatus("idle", "clientId ontbreekt in de configuratie");
      return;
    }
    await waitForGoogle();
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.clientId,
      scope: CONFIG.scope,
      callback: (r) => {
        if (r.error) { pending?.reject(Object.assign(new Error(r.error_description || r.error), { code: r.error })); return; }
        accessToken = r.access_token;
        tokenExpiry = Date.now() + (Number(r.expires_in) - 60) * 1000;
        sessionStorage.setItem("gtoken", JSON.stringify({ accessToken, tokenExpiry }));
        signedIn = true;
        pending?.resolve(accessToken);
      },
      error_callback: (e) => pending?.reject(Object.assign(new Error(e.message || e.type), { code: e.type })),
    });
    try {
      const saved = JSON.parse(sessionStorage.getItem("gtoken") || "null");
      if (saved && Date.now() < saved.tokenExpiry) { accessToken = saved.accessToken; tokenExpiry = saved.tokenExpiry; signedIn = true; await afterLogin(); }
    } catch (_) {}
  }

  async function login() {
    try { setStatus("loading", "Inloggen..."); await requestToken(); await afterLogin(); }
    catch (e) { setStatus("error", e.code === "popup_closed" ? "Inloggen geannuleerd." : `Inloggen mislukt: ${e.message}`); }
  }

  function logout() {
    if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
    accessToken = null; tokenExpiry = 0; signedIn = false;
    sessionStorage.removeItem("gtoken");
    state.entries = []; state.loaded = false; state.prefilled = false;
    updateAuthUi(); renderRecent(); updateHint();
    setStatus("idle", "Uitgelogd");
  }

  function updateAuthUi() {
    $("#loginBtn").classList.toggle("hidden", signedIn);
    $("#logoutBtn").classList.toggle("hidden", !signedIn);
    $("#account").textContent = signedIn ? "Verbonden met Google" : "";
    $("#saveBtn").disabled = !signedIn || !state.loaded;
  }

  async function afterLogin() {
    updateAuthUi();
    setStatus("loading", "Laden...");
    try { await refresh(); setStatus("idle", `Verbonden met Google Sheets (${SHEET})`); }
    catch (e) { setStatus("error", explain(e)); }
  }

  /* ---------------- Google Sheets API ---------------- */
  const API = "https://sheets.googleapis.com/v4/spreadsheets";
  const a1 = (a) => `'${SHEET.replace(/'/g, "''")}'!${a}`;
  const rng = (a) => encodeURIComponent(a1(a));

  async function sheets(method, path, body) {
    const token = await ensureToken();
    const res = await fetch(`${API}/${SHEET_ID}${path}`, {
      method,
      headers: { Authorization: `Bearer ${token}`, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).error?.message || msg; } catch (_) {}
      if (res.status === 401) { accessToken = null; sessionStorage.removeItem("gtoken"); }
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return res.json();
  }

  function explain(e) {
    if (/not supported for this document/i.test(e.message)) return "Dit is nog een Excel-bestand. Open het in Google Drive en kies Bestand > Opslaan als Google Spreadsheet; gebruik daarna het nieuwe adres in CONFIG.";
    if (/unable to parse range/i.test(e.message)) return `Tabblad "${SHEET}" niet gevonden. Controleer sheetName.`;
    if (e.status === 404) return "Spreadsheet niet gevonden. Controleer het adres in CONFIG.";
    if (e.status === 403) return "Geen toegang. Zet de Google Sheets API aan, voeg jezelf toe als testgebruiker en log in met het account dat het bestand bezit of mag bewerken.";
    if (e.status === 401) return "Sessie verlopen. Klik opnieuw op Opslaan of log opnieuw in.";
    if (e.status === 429) return "Te veel verzoeken. Probeer het over een halve minuut opnieuw.";
    return `Fout: ${e.message}`;
  }

  async function resolveSheet() {
    if (SHEET) return;
    const r = await sheets("GET", "?fields=sheets.properties(sheetId,title)");
    const list = (r.sheets || []).map((s) => s.properties);
    if (!list.length) throw new Error("Geen tabbladen gevonden in de spreadsheet.");
    SHEET = (GID && list.find((p) => String(p.sheetId) === GID)?.title) || list[0].title;
  }

  async function refresh() {
    await ensureToken();
    await resolveSheet();
    const [vr, fr] = await Promise.all([
      sheets("GET", `/values/${rng("A1:AZ")}?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`),
      sheets("GET", `/values/${rng("A1:AZ")}?valueRenderOption=FORMULA`),
    ]);
    const values = vr.values || [];
    const formulas = fr.values || [];

    // Kopregel: vast opgegeven, of de eerste rij (bovenaan) met een kolom "datum"
    let hIdx = CONFIG.headerRow ? CONFIG.headerRow - 1 : values.slice(0, 15).findIndex((r) => r.some((x) => /^(datum|date)$/i.test(String(x).trim())));
    if (hIdx < 0) hIdx = 0;
    const headers = (values[hIdx] || []).map((x) => String(x ?? ""));
    while (headers.length && !headers[headers.length - 1].trim()) headers.pop();
    if (!headers.length) throw new Error(`Geen kopregel gevonden in tabblad "${SHEET}". Zet CONFIG.headerRow op het rijnummer van de kolomkoppen.`);

    // Groeplabels (rij boven de kopregel, vaak samengevoegde cellen: doorvullen naar rechts)
    const groupRow = hIdx > 0 ? values[hIdx - 1] || [] : [];
    const groups = [];
    let g = "";
    for (let j = 0; j < headers.length; j++) {
      const v = String(groupRow[j] ?? "").trim();
      if (v) g = v; else if (!headers[j].trim()) g = "";
      groups[j] = g;
    }
    state.title = hIdx > 1 ? (values[0] || []).find((x) => String(x).trim() !== "") ?? "" : "";

    const rows = values.slice(hIdx + 1);
    const inf = inferColumns(headers, groups, rows, formulas.slice(hIdx + 1));
    const sig = JSON.stringify(inf.cols.map((c) => [c.header, c.group, c.kind, c.unit, c.min, c.max, c.chips]));
    state.cols = inf.cols; state.ncols = headers.length; state.dateIdx = inf.dateIdx; state.dagIdx = inf.dagIdx;
    state.headerRow = hIdx + 1;
    state.lastRow = Math.max(values.length, hIdx + 1);

    state.entries = [];
    state.dateAsText = false; state.dateStyle = null; state.dagShort = false;
    for (let j = hIdx + 1; j < values.length; j++) {
      const vals = Array.from({ length: state.ncols }, (_, k) => values[j][k] ?? "");
      const iso = state.dateIdx >= 0 ? normDate(vals[state.dateIdx]) : null;
      state.entries.push({ row: j + 1, iso, vals });
    }
    if (state.dateIdx >= 0) {
      for (let j = values.length - 1; j > hIdx; j--) {
        const d = values[j][state.dateIdx];
        if (d !== undefined && d !== "") {
          state.dateAsText = typeof d === "string";
          const m = typeof d === "string" && d.match(/^(\d{1,2})([-\/.])(\d{1,2})\2(\d{4})$/);
          state.dateStyle = m ? { dmy: true, sep: m[2] } : null;
          break;
        }
      }
    }
    if (state.dagIdx >= 0) {
      const ds = rows.map((r) => r[state.dagIdx]).filter((v) => typeof v === "string" && v.trim());
      state.dagShort = ds.length > 0 && ds.every((v) => v.trim().length <= 3);
    }
    state.loaded = true;
    $("#subtitle").textContent = state.title ? String(state.title) : "Gegevens in Google Sheets";
    if (sig !== state.sig) { state.sig = sig; buildForm(); }
    updateAuthUi();
    onDateChange(false);
  }

  const findRow = (iso) => [...state.entries].reverse().find((e) => e.iso && e.iso === iso);

  const writeDate = (iso) => {
    if (!state.dateAsText) return iso;
    if (state.dateStyle?.dmy) { const [y, m, d] = iso.split("-"); return [d, m, y].join(state.dateStyle.sep); }
    return iso;
  };

  async function save() {
    if (!signedIn || !state.loaded) return;
    const vals = collect();
    if (!vals) return;
    $("#saveBtn").disabled = true;
    setStatus("loading", "Opslaan...");
    try {
      await ensureToken();                     // eerst, binnen de klik (popup-blokkade)
      await refresh();                         // altijd met de nieuwste stand werken
      const iso = state.dateIdx >= 0 ? vals[state.dateIdx] : null;
      const existing = iso ? findRow(iso) : null;
      const row = existing ? existing.row : state.lastRow + 1;
      if (iso) vals[state.dateIdx] = writeDate(iso);
      if (state.dagIdx >= 0 && iso) vals[state.dagIdx] = dagLabel(iso);

      // Bestaande rij: dag en datum staan er al en blijven onaangeroerd.
      // Berekende kolommen worden nooit beschreven. Alleen aaneengesloten groepen kolommen schrijven.
      const skip = new Set(existing ? [state.dateIdx, state.dagIdx] : []);
      const writable = (j) => state.cols[j].editable && !skip.has(j);
      const data = [];
      let start = null;
      const flush = (end) => { if (start != null) { data.push({ range: a1(`${colLetter(start + 1)}${row}:${colLetter(end + 1)}${row}`), values: [vals.slice(start, end + 1)] }); start = null; } };
      for (let j = 0; j < state.ncols; j++) { if (writable(j)) { if (start == null) start = j; } else flush(j - 1); }
      flush(state.ncols - 1);

      await sheets("POST", "/values:batchUpdate", { valueInputOption: state.dateAsText ? "RAW" : "USER_ENTERED", data });
      await refresh();
      setStatus("success", existing ? "Succesvol bijgewerkt in Google Sheets!" : "Nieuwe rij toegevoegd in Google Sheets!");
    } catch (e) { setStatus("error", explain(e)); }
    finally { $("#saveBtn").disabled = !signedIn || !state.loaded; }
  }

  /* ---------------- Datumlogica en overzicht ---------------- */
  function updateHint() {
    const hint = $("#dateHint");
    if (!hint) return;
    if (!signedIn || !state.loaded) { hint.textContent = ""; return; }
    const e = findRow(ctl[state.dateIdx].get());
    hint.textContent = e ? `Deze dag staat al in de sheet (rij ${e.row}). Opslaan vult die rij aan of werkt hem bij.` : "Deze datum staat nog niet in de sheet: er wordt een rij onderaan toegevoegd.";
  }

  function onDateChange(fill = true) {
    if (state.dateIdx >= 0 && ctl[state.dateIdx]) {
      const iso = ctl[state.dateIdx].get();
      if (state.dagIdx >= 0 && ctl[state.dagIdx]) ctl[state.dagIdx].set(iso ? dagLabel(iso) : "");
      const e = state.loaded ? findRow(iso) : null;
      const fillFrom = (en) => { for (const c of dataCols()) ctl[c.idx].set(en.vals[c.idx] ?? ""); state.prefilled = true; };
      if (e) { if (fill || !state.prefilled) fillFrom(e); }
      else if (state.prefilled) { for (const c of dataCols()) ctl[c.idx].set(""); state.prefilled = false; }
      updateHint();
    }
    renderRecent();
  }

  // De zeven dagen tot en met de gekozen datum, met de eerste drie invoerkolommen.
  function renderRecent() {
    const box = $("#recent");
    box.replaceChildren();
    const sel = state.dateIdx >= 0 && ctl[state.dateIdx] ? ctl[state.dateIdx].get() : "";
    let list = state.entries;
    if (state.dateIdx >= 0 && sel) list = list.filter((e) => e.iso && e.iso <= sel);
    const shown = list.slice(-7).reverse();
    $("#recentCard").hidden = !shown.length || !state.loaded;
    const extra = dataCols().slice(0, 3);
    for (const e of shown) {
      const head = state.dateIdx >= 0 ? `${state.dagIdx >= 0 ? e.vals[state.dagIdx] + " " : ""}${e.iso || fmt(e.vals[state.dateIdx])}` : `Rij ${e.row}`;
      const kids = [h("span", {}, head), ...extra.map((c) => h("span", { class: "m" }, `${c.label} ${e.vals[c.idx] === "" ? "–" : fmt(e.vals[c.idx])}`))];
      box.append(h("button", { type: "button", class: "rowbtn", onclick: () => {
        if (!e.iso || !ctl[state.dateIdx]) return;
        ctl[state.dateIdx].set(e.iso); state.prefilled = false; onDateChange(true); window.scrollTo({ top: 0, behavior: "smooth" });
      } }, kids));
    }
  }

  /* ---------------- Start ---------------- */
  $("#recentTitle").prepend(icon("chart"));
  $("#loginBtn").addEventListener("click", login);
  $("#logoutBtn").addEventListener("click", logout);
  $("#saveBtn").addEventListener("click", save);
  updateAuthUi();
  initAuth().catch((e) => setStatus("error", `Initialisatie mislukt: ${e.message}`));
})();
</script>
</body>
</html>
